# Every push to main (or a manual run) builds the Windows game, wraps it in a one-click
# installer and publishes a GitHub Release (pull requests only build it, as an artifact). Installed games see the new release on their
# next launch and update themselves (scripts/updater.gd).
name: release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "tests/**"]
  pull_request:  # builds the installer as a downloadable artifact, doesn't publish
    paths-ignore: ["**.md", "tests/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        name: pick version
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: stamp version into project.godot
        run: |
          sed -i 's/^config\/version=.*/config\/version="${{ steps.ver.outputs.version }}"/' project.godot
          grep config/version project.godot

      - name: cache godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-win-linux-templates

      - name: get godot + windows / linux export templates
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          if [ ! -f Godot_v${GODOT_VERSION}-stable_linux.x86_64 ]; then
            curl -sSLo g.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && unzip -q g.zip && rm g.zip
          fi
          if [ ! -f templates/windows_release_x86_64.exe ] || [ ! -f templates/linux_release.x86_64 ]; then
            curl -sSLo t.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            unzip -q -o t.tpz 'templates/windows_*' 'templates/linux_release.x86_64' 'templates/version.txt' && rm t.tpz
          fi
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest && cp templates/* $dest/

      # class cache etc. done before GodotSteam is in the tree: the headless editor never quits
      # with the extension loaded (hung for the whole 10 min timeout in ci)
      - name: import project
        run: timeout 300 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --quit || true

      # multiplayer: GodotSteam (steam lobbies + p2p). downloaded, not committed
      - name: cache godotsteam
        uses: actions/cache@v4
        with:
          path: addons/godotsteam
          key: godotsteam-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/fetch_godotsteam.sh') }}

      - name: get godotsteam
        run: |
          if [ ! -f addons/godotsteam/godotsteam.gdextension ]; then bash tools/fetch_godotsteam.sh; fi
          cat addons/godotsteam/godotsteam.gdextension

      - name: export windows build
        run: |
          G=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          # register the extension the way the editor would
          echo "res://addons/godotsteam/godotsteam.gdextension" > .godot/extension_list.cfg
          # the extension loads and has every steam call the multiplayer code uses
          timeout 120 $G --headless --path . --script res://tests/steam_check.gd
          mkdir -p build/win
          timeout 900 $G --headless --path . --export-release "Windows" build/win/CatGame.exe
          test -s build/win/CatGame.exe
          # GodotSteam's dll + steam_api64.dll sit next to the exe; steam_appid.txt makes steam
          # treat it as the test app (480) when it's launched outside steam
          ls build/win/*.dll
          echo 480 > build/win/steam_appid.txt
          ls -la build/win

      - uses: actions/upload-artifact@v4
        with:
          name: CatGame-win
          path: build/win/
          retention-days: 3

      # dedicated servers (scripts/net/dedicated_server.gd). they carry GodotSteam *Server* (steam
      # server list) instead of the client GodotSteam. if that download fails they still build, as
      # direct-ip servers, and none of this can break the game release
      - name: get godotsteam server
        id: gss
        continue-on-error: true
        run: GODOTSTEAM_FLAVOR=server bash tools/fetch_godotsteam.sh

      - name: export dedicated servers
        continue-on-error: true
        run: |
          G=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mv addons/godotsteam "$RUNNER_TEMP/godotsteam_client"
          trap 'mv "$RUNNER_TEMP/godotsteam_client" addons/godotsteam' EXIT   # put it back for the cache
          ext="$(ls addons/godotsteam_server/*.gdextension 2>/dev/null | head -n1 || true)"
          if [ -n "$ext" ]; then
            cat "$ext"
            echo "res://$ext" > .godot/extension_list.cfg
            timeout 120 $G --headless --path . --script res://tests/steam_server_check.gd || echo "::warning::steam server api check failed, servers may not show on the steam list"
          else
            echo "::warning::no GodotSteam Server, the servers are direct-ip only"
            : > .godot/extension_list.cfg
          fi
          # relay works: server + two clients on localhost
          timeout 120 $G --headless --path . --script res://tests/server_test.gd
          mkdir -p build/server-linux build/server-win build/servers
          timeout 900 $G --headless --path . --export-release "Linux Server" build/server-linux/CatGameServer.x86_64
          timeout 900 $G --headless --path . --export-release "Windows Server" build/server-win/CatGameServer.exe
          for d in build/server-linux build/server-win; do
            echo 480 > $d/steam_appid.txt
            cp tools/server/* $d/
          done
          chmod +x build/server-linux/CatGameServer.x86_64 build/server-linux/*.sh
          # the exported linux server boots on its own (feature tag dedicated_server -> server.tscn).
          # under gdb so a crash prints a backtrace
          ls -la build/server-linux
          command -v gdb >/dev/null || sudo apt-get install -y -qq gdb >/dev/null
          for extra in --no-steam ""; do
            echo "== smoke run ${extra:-with steam}"
            timeout 60 gdb -q -batch -ex run -ex bt --args build/server-linux/CatGameServer.x86_64 --headless --quit-after 600 -- --port 24791 $extra > server-smoke.log 2>&1 || true
            cat server-smoke.log
            grep -q "up on udp 24791" server-smoke.log
          done
          ls -la build/server-linux build/server-win
          (cd build/server-linux && tar czf ../servers/CatGameServer-linux.tar.gz .)
          (cd build/server-win && zip -qr ../servers/CatGameServer-windows.zip .)

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: CatGame-server-dirs
          path: |
            build/server-linux/
            build/server-win/
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: CatGame-servers
          path: build/servers/
          retention-days: 3
          if-no-files-found: warn

  installer:
    needs: export
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.export.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CatGame-win
          path: build/win

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CatGame-servers
          path: build/servers

      - name: build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\catgame.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\win\* -DestinationPath build\installer\CatGame-windows.zip
          Get-ChildItem build\installer

      - uses: actions/upload-artifact@v4
        with:
          name: CatGame-Setup
          path: build/installer/CatGame-Setup.exe
          retention-days: 7

      - name: publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $notes = "Download **CatGame-Setup.exe** and run it (one click, no admin needed). Already installed? The game updates itself on launch.`n`nBuilt from ${{ github.sha }}."
          $files = @("build\installer\CatGame-Setup.exe", "build\installer\CatGame-windows.zip")
          $files += @(Get-ChildItem build\servers -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($files.Count -gt 2) { $notes += "`n`nDedicated server: **CatGameServer-linux.tar.gz** / **CatGameServer-windows.zip**, see the readme." }
          gh release create "v$env:VERSION" @files `
            --target "${{ github.sha }}" --title "Cat Game v$env:VERSION" --notes "$notes" --latest
